<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8E1C1C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Crave Driver" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="stylesheet" href="driver.css?v=4" />
  <title>Driver · Crave It</title>
</head>
<body class="driver-body">
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="assets/logo-mark.svg" alt="" width="40" height="40" />
      <span class="brand-text"><strong>Driver</strong><small>Crave It POS</small></span>
    </a>
    <div class="header-actions">
      <a class="ghost-btn" href="index.html">Customer</a>
      <a class="ghost-btn" href="ops.html">Ops</a>
    </div>
  </header>

  <main class="shell driver-main">
    <section class="driver-gate" id="driver-gate">
      <p class="eyebrow">Staff door</p>
      <h1>Pick your truck</h1>
      <p class="meta">Same phone install as customers. This side is route, orders, GPS ping, and stock.</p>
      <label>Staff code
        <input id="ops-token" type="password" autocomplete="current-password" value="crave-local-ops" />
      </label>
      <label>Truck
        <select id="vehicle-select"></select>
      </label>
      <button class="btn btn-chile full" id="enter-driver" type="button">Open driver board</button>
      <p id="gate-status" class="form-status" role="status"></p>
    </section>

    <section class="driver-board" id="driver-board" hidden>
      <div class="driver-top">
        <div>
          <p class="eyebrow" id="driver-zone">Zone</p>
          <h1 id="driver-truck-name">Truck</h1>
          <p class="meta" id="driver-status-line">—</p>
        </div>
        <div class="driver-top-actions">
          <button class="btn btn-gold" id="ping-gps" type="button">Ping GPS</button>
          <button class="chip" id="switch-truck" type="button">Switch</button>
        </div>
      </div>

      <div class="driver-map-shell">
        <div id="driver-map" class="driver-map" role="region" aria-label="Your truck map"></div>
      </div>

      <div class="driver-tabs" role="tablist">
        <button class="chip active" data-tab="orders" type="button">Orders</button>
        <button class="chip" data-tab="stock" type="button">Stock</button>
        <button class="chip" data-tab="status" type="button">Status</button>
      </div>

      <section class="driver-panel" data-panel="orders">
        <div id="order-list" class="order-list"></div>
      </section>

      <section class="driver-panel" data-panel="stock" hidden>
        <div id="stock-list" class="stock-list"></div>
      </section>

      <section class="driver-panel" data-panel="status" hidden>
        <div class="status-actions">
          <button class="btn btn-chile" data-set-status="ACTIVE" type="button">Go live</button>
          <button class="btn btn-gold" data-set-status="RESTOCKING" type="button">Restocking</button>
          <button class="ghost-btn" data-set-status="OFFLINE" type="button">Offline</button>
        </div>
        <label>Location label
          <input id="location-label" placeholder="Corner of …" />
        </label>
        <button class="btn btn-chile full" id="save-label" type="button">Save label</button>
        <p class="meta">GPS ping uses your phone location and updates the live customer map.</p>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="driver.js" type="module"></script>
</body>
</html>
